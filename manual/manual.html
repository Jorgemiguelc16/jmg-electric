<style>
  @page{size:A4;margin:18mm 16mm 16mm;
    @top-left{content:"JMG - ELECTRIC v2.4 · Manual de usuario y referencia técnica";font:7.5pt Arial,sans-serif;color:#333}
    @top-right{content:"JMG Projects & Energy";font:7.5pt Arial,sans-serif;color:#333}
    @bottom-right{content:"Página " counter(page) " de " counter(pages);font:7.5pt Arial,sans-serif;color:#333}}
  @page:first{@top-left{content:none}@top-right{content:none}@bottom-right{content:none}}
  @page ancho{size:A4 landscape;page-orientation:rotate-left}
  *{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  html,body{margin:0;background:#fff;color:#000;font:9.6pt/1.5 Arial,Helvetica,sans-serif}

  p{margin:0 0 7px;text-align:justify}
  ul,ol{margin:0 0 8px;padding-left:22px}li{margin:0 0 3px}
  table{width:100%;border-collapse:collapse;margin:4px 0 10px;font-size:8.4pt;break-inside:auto}
  th,td{border:.6pt solid #000;padding:3px 6px;text-align:left;vertical-align:top}

  td.c,th.c{text-align:center}td.r,th.r{text-align:right}

  .caja{border:.6pt solid #000;padding:7px 10px;margin:6px 0 10px;break-inside:avoid}

  .mx{font-family:"Cambria Math",Cambria,"Times New Roman",serif;font-size:10.5pt;white-space:nowrap}
  .mf{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:1px 2px;line-height:1.15}
  .mf>span:first-child{border-bottom:.7pt solid #000;padding:0 3px 1px}.mf>span:last-child{padding:1px 3px 0}

  .ancho{page:ancho;break-before:page}
  .portada{height:257mm;display:flex;flex-direction:column;border:1pt solid #000;padding:16mm 14mm 10mm}
  .portada .top{display:flex;align-items:center;gap:14px;padding-bottom:12px;border-bottom:1.5pt solid #000}
  .portada .top img{width:66px;height:66px}.portada .top b{display:block;font-size:17pt}.portada .top span{font-size:9.5pt;color:#333}
  .portada .mid{margin:auto 0}
  .portada .eye{font-size:10pt;letter-spacing:.22em;text-transform:uppercase;margin:0}
  .portada h1{font-size:28pt;border:0;margin:8px 0 6px;display:block;line-height:1.1}
  .portada .sub{font-size:13pt;margin:0;color:#222}
  .portada dl{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;border-top:.6pt solid #000;padding-top:14px;margin:0 0 18px;font-size:10pt}
  .portada dt{text-transform:uppercase;font-size:8pt;letter-spacing:.08em;color:#333;align-self:center}.portada dd{margin:0}
  .portada .foot{display:flex;justify-content:space-between;font-size:8.5pt;border-top:1pt solid #000;padding-top:8px}
  .toc ol{list-style:none;padding:0;margin:0}

  .toc li span{min-width:34px}.toc li.l0{font-weight:700;margin-top:6px}.toc li.l1{padding-left:24px}.toc li.p{font-weight:700;margin-top:12px;border-bottom:1pt solid #000;text-transform:uppercase;letter-spacing:.05em}
  .firmas{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:16px;break-inside:avoid}

  .firma dl{display:grid;grid-template-columns:90px 1fr;gap:5px 8px;margin:0;font-size:8.6pt}.firma dd{margin:0;border-bottom:.5pt dotted #777;min-height:13px}
  .obs-tbl td{height:30px}

<body>
<div id="doc"></div>
<script>
/* ---------- utilidades ---------- */
const f=(x,d=2)=>Number.isFinite(x)?x.toLocaleString("es-PE",{minimumFractionDigits:d,maximumFractionDigits:d,useGrouping:false}):"—";
const mi=s=>`<i>${s}</i>`, sb=(v,s)=>`<i>${v}</i><sub>${s}</sub>`, fr=(a,b)=>`<span class="mf"><span>${a}</span><span>${b}</span></span>`, sq=x=>`√<span class="ms">${x}</span>`, mx=x=>`<span class="mx">${x}</span>`;
const tbl=(head,rows,cls="")=>`<table class="${cls}"><thead><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
const kv=rows=>`<table class="kv"><tbody>${rows.map(([k,v])=>`<tr><th>${k}</th><td>${v}</td></tr>`).join("")}</tbody></table>`;
const fig=(img,txt)=>`<figure class="fig"><img src="img/${img}.png" alt=""><figcaption>${txt}</figcaption></figure>`;
const TOC=[]; let n1=0,n2=0;
// Cada título lleva un id para que el índice enlace a él (el PDF conserva los enlaces)
const tid=n=>"m-s"+n.replace(/\./g,"-");
const parte=(rom,t,d)=>{ TOC.push(["",`Parte ${rom} · ${t}`,"p",`m-p${rom}`]); return `<section class="parte" id="m-p${rom}"><p>Parte ${rom}</p><h1>${t}</h1><div>${d}</div></section>`; };
const cap=(t,cls="cap")=>{ n1++; n2=0; TOC.push([`${n1}`,t,"l0",tid(`${n1}`)]); return `<section class="${cls}"><h1 id="${tid(`${n1}`)}"><span class="n">${n1}.</span>${t}</h1>`; };
const sub=t=>{ n2++; TOC.push([`${n1}.${n2}`,t,"l1",tid(`${n1}.${n2}`)]); return `<h2 id="${tid(`${n1}.${n2}`)}"><span class="n">${n1}.${n2}</span>${t}</h2>`; };
const fin="</section>";
const fecha=new Date().toLocaleDateString("es-PE",{day:"2-digit",month:"long",year:"numeric"});
let B="";

/* ================= PARTE I · MANUAL DE USUARIO ================= */
B+=parte("I","Manual de usuario","Cómo crear un proyecto, ingresar los datos de la vivienda o del edificio, revisar los resultados y obtener la memoria de cálculo en Excel, el expediente técnico en PDF y el diagrama unifilar para AutoCAD.");

B+=cap("Introducción");
B+=sub("Qué es JMG - ELECTRIC");
B+=`<p>JMG - ELECTRIC es una aplicación web para el cálculo de instalaciones eléctricas interiores de <b>viviendas unifamiliares</b> (de uno o varios pisos), <b>edificios multifamiliares</b> y <b>otros usos</b>: oficinas, locales comerciales y demás actividades de la Tabla 14, escuelas, hospitales y hoteles, conforme al Código Nacional de Electricidad – Utilización (CNE-U), al Reglamento Nacional de Edificaciones, Norma EM.010, y a la Norma DGE de conexiones en baja tensión. Funciona en el navegador, sin instalación, en <b>jorgemiguelc16.github.io/jmg-electric</b>.</p>
<p>A partir de los datos del proyecto calcula la máxima demanda, los alimentadores y circuitos derivados, las protecciones, la caída de tensión, el cortocircuito, el balance de fases y la puesta a tierra; dibuja el diagrama unifilar y genera el metrado, la memoria de cálculo en Excel y el expediente técnico en PDF.</p>`;
B+=sub("Alcance del cálculo");
B+=`<ul>${ALCANCE.map(t=>`<li>${t}</li>`).join("")}</ul>`;
B+=sub("Responsabilidad");
B+=`<div class="caja"><p>Los resultados son una herramienta de apoyo al diseño. Su validación, la adecuación a las condiciones reales de obra y la firma del expediente corresponden al <b>ingeniero colegiado y habilitado</b> que lo suscribe (RNE EM.010, Art. 8). Los proyectos se guardan solo en el navegador del usuario.</p></div>`;
B+=fin;

B+=cap("Primeros pasos");
B+=sub("Pantalla de inicio");
B+=`<p>La plataforma tiene una <b>barra superior</b> con el logotipo, la campana de <b>Novedades</b> y el acceso a <b>Ajustes</b>, y un <b>menú lateral</b> con las secciones: Inicio, Proyectos, Herramientas, Normas aplicadas, Guía y manual, Novedades, Soporte, Acerca de y Ajustes.</p><p>El Inicio es el <b>Centro de ingeniería</b>:</p><ul><li><b>Nuevo proyecto</b> y, si hay uno en curso, <b>Continuar</b>.</li><li><b>Contadores</b> de los proyectos guardados en este navegador: total, completos y conformes, con datos pendientes y el último editado.</li><li><b>Continuar trabajando</b>: los tres últimos proyectos, con un dibujo según su tipo, el avance (según los datos que faltan), el estado del último cálculo (conforme, revisar o datos pendientes) y la máxima demanda. El estado se actualiza cada vez que el proyecto se calcula; los proyectos guardados con versiones anteriores lo muestran al abrirlos una vez. Si no hay proyectos, se ofrecen los ejemplos.</li><li><b>Base normativa</b> y <b>Accesos rápidos</b> a las herramientas de caída de tensión, conductor, puesta a tierra y al manual.</li></ul><p>La sección <b>Acerca de</b> reúne el propósito de la plataforma, su creador, cómo funciona y su alcance.</p>`+fig("inicio","Figura 1. Pantalla de inicio.");
B+=sub("Crear un proyecto nuevo");
B+=`<p>El asistente pide el <b>tipo de edificación</b> (vivienda unifamiliar, edificio multifamiliar o comercial y otros usos, con el uso específico de la edificación), el nombre del proyecto (obligatorio), el propietario, la ubicación, el proyectista, su <b>número de CIP</b> y el sistema de suministro. Al continuar se abre el espacio de trabajo con los datos pendientes marcados en ámbar.</p>`+fig("asistente","Figura 2. Asistente de nuevo proyecto.");
B+=sub("Guardar y abrir proyectos");
B+=`<ul><li>El proyecto se <b>guarda automáticamente</b> en el navegador cuando tiene nombre. Los proyectos de ejemplo no se guardan.</li>
<li>La pestaña <b>Proyectos</b> lista los proyectos guardados con las acciones Abrir, Duplicar, Exportar y Eliminar.</li>
<li><b>Archivo › Guardar copia .json</b> descarga el proyecto a un archivo; <b>Archivo › Abrir .json</b> lo vuelve a cargar, por ejemplo en otra computadora.</li>
<li>Se recomienda exportar periódicamente los proyectos importantes: si se borran los datos del navegador, se pierden.</li></ul>`;
B+=fin;

B+=cap("El espacio de trabajo");
B+=`<p>El espacio de trabajo reúne en una sola pantalla la cinta de opciones, el explorador del proyecto, los resultados y el panel de propiedades.</p>`+fig("resumen","Figura 3. Espacio de trabajo con el proyecto de ejemplo.");
B+=sub("Partes de la pantalla");
B+=tbl(["Zona","Uso"],[
 ["Barra de título","Nombre del proyecto y tipo de edificación. A la derecha: botones para mostrar u ocultar el explorador y las propiedades, la versión, Ayuda y Salir. A la izquierda: Guardar, Deshacer, Rehacer y Exportar Excel."],
 ["Cinta de opciones","Pestañas Archivo, Proyecto, Cargas, Parámetros, Resultados, Unifilar, Herramientas y Ayuda, siempre visibles, con los comandos agrupados en botones grandes y columnas de botones pequeños. La pestaña Proyecto reúne los accesos más usados; Cargas, Parámetros, Resultados y Unifilar llevan además accesos directos a cada dato (por ejemplo, factor de potencia, método de instalación, temperatura, reserva, diferenciales o N.° CIP del rótulo); Archivo y Ayuda incluyen guardar, deshacer, ejemplos, ajustes, novedades y atajos de teclado. El botón Recomendaciones muestra el número de recomendaciones pendientes. Si la cinta no cabe en la pantalla, la rueda del mouse sobre ella la desplaza hacia los lados."],
 ["Explorador del proyecto (izquierda)","Árbol con los datos del proyecto, los tableros y cada circuito. El punto verde indica dato completo y conforme; ámbar, dato pendiente; rojo, circuito que no cumple. Al hacer clic en un elemento se editan sus propiedades."],
 ["Resultados (centro)","Vistas del cálculo: Resumen, Máxima demanda, Alimentadores, Cuadro de cargas, Balance de fases, Diagrama unifilar, Metrado y Verificaciones."],
 ["Propiedades (derecha)","Formulario del elemento seleccionado y, debajo, el resumen del proyecto."],
 ["Barra de estado","Modo de cálculo, máxima demanda, alimentador, caída de tensión máxima y estado general (CONFORME o REVISAR)."]]);
B+=sub("Paneles laterales");
B+=`<ul><li>El ancho del explorador y de las propiedades se ajusta <b>arrastrando su borde</b>; doble clic en el borde restablece el ancho.</li>
<li>Cada panel se cierra con la <b>×</b> de su encabezado y se vuelve a abrir con los botones de la barra de título.</li>
<li><b>Zoom de los resultados:</b> los botones <b>−</b>, <b>100 %</b> y <b>+</b> de la esquina inferior derecha del panel central acercan o alejan solo los resultados (por ejemplo, para revisar el diagrama unifilar en detalle), de 50 % a 300 %. También se usa <b>Ctrl + rueda del mouse</b> sobre el panel. Con zoom mayor de 100 % el contenido se desplaza arrastrándolo con el mouse; el botón del porcentaje vuelve al tamaño normal.</li>
<li><b>Ayuda de cada dato:</b> al pasar el cursor sobre un dato o su nombre aparece su explicación.</li>
<li><b>Tamaño de la pantalla:</b> el espacio de trabajo se muestra por defecto al <b>80 %</b>, para ver a la vez la cinta, el árbol, los resultados y las propiedades sin desplazarse. Se cambia a 90 % o 100 % en <b>Ajustes › Tamaño del espacio de trabajo</b>. Conviene dejar el zoom del navegador en 100 % (Ctrl + 0), porque los dos se multiplican. En las páginas de inicio, si el navegador se aleja, la plataforma compensa el tamaño para que el contenido no quede diminuto.</li></ul>`;
B+=sub("Cálculo automático y resaltar pendientes");
B+=`<ul><li><b>Cálculo automático</b> (activado por defecto): los resultados se actualizan con cada cambio. Al desactivarlo la aplicación advierte que los resultados podrán no corresponder a los datos; se recalcula con <b>Calcular ahora</b> o la tecla <span class="k">F9</span>. Al exportar el Excel, el PDF o el unifilar siempre se recalcula.</li>
<li><b>Resaltar pendientes</b>: marca en ámbar los datos obligatorios que faltan. Al desactivarlo también se muestra una advertencia.</li></ul>`;
B+=sub("Atajos de teclado");
B+=tbl(["Tecla","Acción"],[[`<span class="k">Ctrl</span> + <span class="k">Z</span>`,"Deshacer"],[`<span class="k">Ctrl</span> + <span class="k">Y</span>`,"Rehacer"],[`<span class="k">F9</span>`,"Calcular ahora"],[`<span class="k">Esc</span>`,"Cerrar el diálogo abierto"]]);
B+=fin;

B+=cap("Vivienda unifamiliar");
B+=sub("Datos de la vivienda");
B+=`<p>En <b>Vivienda</b> se ingresan el área techada, el área de sótano (se computa al 75 %), el <b>área libre no techada</b> con su carga unitaria y la longitud del alimentador desde el medidor hasta el tablero general TG. En <b>Sistema eléctrico</b> se elige monofásico 220 V, trifásico 380/220 V o trifásico 220 V.</p><p>El <b>área libre no techada</b> (patios, jardines, cocheras abiertas) se usa cuando el proyectista prevé iluminarla o poner tomacorrientes en ella. Su carga es el área por la <b>carga unitaria</b>, 5 W/m² por defecto y editable, y se suma al 100 % a la máxima demanda de la vivienda (y a la del 1er piso cuando este tiene tablero propio). Este valor <b>no figura en el CNE-Utilización</b>: es un criterio del proyectista que se usa como referencia, y la memoria lo indica así. Con área libre 0 el cálculo no cambia.</p>`;
B+=sub("Salidas");
B+=`<p>Para alumbrado, tomacorrientes generales y tomacorrientes de cocina o lavandería se indica la <b>cantidad de salidas</b>, la <b>potencia por salida</b> (100 W y 180 W típicos) y la <b>longitud</b> desde el tablero hasta la salida más alejada. La aplicación forma los circuitos con un máximo de 12 salidas cada uno (Regla 070-3000).</p><p>Si hay <b>luminarias de distintas potencias</b>, las salidas de la potencia principal se indican en la fila de alumbrado y las demás con <b>+ Luminarias de otra potencia</b> (cantidad, W por salida y, si la vivienda tiene varios pisos, el piso). Por ejemplo, 25 luminarias de las que 8 son de 36 W: 17 salidas de 100 W en la fila y 8 × 36 W en la lista. Los circuitos de alumbrado se llenan en ese orden con la potencia real de cada salida, siempre con un máximo de 12 salidas por circuito; el ejemplo da tres circuitos de 900 W, 800 W y 288 W. Estas luminarias aumentan la potencia instalada y la corriente de los circuitos, pero no la máxima demanda, que el CNE calcula por área (Regla 050-200).</p><p>De la misma forma, <b>+ Tomacorrientes de otra potencia</b> agrega tomacorrientes con una potencia distinta a la general, solo para casos excepcionales (por ejemplo, un punto previsto para un equipo de mayor consumo). En viviendas de varios pisos, las luminarias y los tomacorrientes de otra potencia de cualquier piso se agregan en Salidas eligiendo el piso; en <b>Vivienda › Pisos y tableros</b> hay dos botones que los agregan directamente en el piso superior. En edificios, ambas listas están en <b>Departamentos</b>, por tipo de departamento.</p><p>Con luminarias LED es normal usar potencias menores de 100 W por salida: se ingresa la potencia real del equipo y la aplicación no lo marca como observación.</p>`;
B+=sub("Cargas especiales");
B+=`<p>Cada carga especial (ducha o terma, cocina eléctrica, aire acondicionado, motor u otra carga) tiene su propio circuito. Se indica la descripción, el tipo, las fases, la potencia y la longitud. Las cargas trifásicas solo se aplican si el suministro es trifásico. En viviendas de varios pisos se elige además el <b>tablero</b> del que se alimenta.</p>`;
B+=sub("Viviendas de varios pisos");
B+=`<p>En <b>Vivienda › Pisos y tableros</b>, el botón <b>+ Agregar piso</b> añade el 2do, 3er piso, etc. Cada piso tiene su <b>tablero de distribución TD</b> alimentado desde el TG, con su área, la longitud TG → TD, sus salidas y longitudes.</p>
<ul><li><b>Circuitos del 1er piso</b>: pueden salir del propio TG o de un tablero TD-1; en ese caso el TG solo alimenta los tableros de piso y las cargas asignadas a él.</li>
<li>El alimentador general se calcula con la máxima demanda de toda la vivienda; cada alimentador de piso, con la Regla 050-200 aplicada al área de ese piso y a las cargas especiales conectadas a su tablero.</li>
<li>Al quitar un piso, sus cargas especiales pasan al TG.</li></ul>`+fig("pisos","Figura 4. Vivienda de tres pisos: máxima demanda por piso y formulario de pisos.");
B+=fin;

B+=cap("Edificio multifamiliar");
B+=`<p>En el modo multifamiliar el edificio se describe por <b>tipos de departamento</b>. Para cada tipo se indica la cantidad de unidades, el área, la longitud del alimentador (medidor → tablero del departamento), las salidas de alumbrado y tomacorrientes, la cocina, el calentador, el aire acondicionado, otras cargas mayores de 1 500 W y la longitud de los circuitos.</p><p>Las salidas de alumbrado de cada departamento usan la potencia por salida de Parámetros. Las <b>luminarias de otra potencia</b> se agregan debajo de la lista de departamentos, indicando el tipo al que pertenecen y la cantidad por departamento.</p>
<p>Los <b>servicios generales</b> (alumbrado de áreas comunes, iluminación de emergencia, electrobombas, intercomunicadores) se agrupan en el tablero TSG. En <b>Sistema eléctrico</b> se indican el sistema del edificio y las longitudes del alimentador general y del alimentador al TSG. El banco de medidores se ubica en el primer piso (Norma DGE, 301.C).</p>`;
B+=fin;

B+=cap("Oficinas, locales comerciales y otros usos");
B+=`<p>Además de viviendas y edificios multifamiliares, la aplicación calcula edificaciones de <b>otros tipos de uso</b> según la <b>Regla 050-210 y la Tabla 14</b> del CNE-Utilización: oficinas, locales industriales y comerciales, bodegas y restaurantes, bancos, barberías y salones de belleza, clubes, hospedajes, teatros, auditorios, iglesias, cortes de justicia, garajes y edificios de almacenaje. Se eligen al crear el proyecto con la opción <b>Comercial y otros usos</b> del asistente, o después en <b>Proyecto → Tipo de edificación → Uso de la edificación</b>. En <b>Proyectos → Ver un ejemplo → Oficina</b> hay un ejemplo de 250 m² ya calculado; los pisos, tableros, salidas, cargas especiales y luminarias se ingresan igual que en una vivienda.</p>
<p>Diferencias con la vivienda:</p>
<ul><li><b>Máxima demanda</b>: carga por área (W/m² de la Tabla 14 × área) afectada por el factor de demanda de la tabla, más las <b>cargas especiales</b> (aire acondicionado, equipos, vitrinas, cómputo) a su potencia nominal (Regla 050-210(b)). En oficinas el factor cambia a partir de los 930 m².</li>
<li><b>Área</b>: se mide con las <b>dimensiones exteriores</b> y el sótano se cuenta al 100 % como área servida (en vivienda se usan dimensiones interiores y el sótano al 75 %, Regla 050-110).</li>
<li><b>Sin corriente mínima de 40 A</b>: la Regla 050-200(1)(b) es propia de viviendas.</li>
<li><b>Corriente de diseño de los alimentadores 1.25 × I</b>: a diferencia de la vivienda, el CNE no declara no continua la carga de estos usos, por lo que rige la Regla 050-104(3) (carga continua). El parámetro «Reserva en alimentadores de vivienda» no se aplica.</li>
<li><b>Tomacorrientes: ${VA_TOMA_COM} VA por salida</b> al elegir un uso comercial. El CNE-Utilización no fija una potencia por tomacorriente para estos locales (para circuitos derivados manda la carga conectada, Regla 050-102(3)); los ${VA_TOMA_COM} VA son un <b>criterio de ingeniería</b> de uso frecuente en Perú, que deja margen para impresoras, fotocopiadoras y varias computadoras en un mismo punto dúplex. El valor es editable. La aplicación lo ingresa como potencia en W y calcula la corriente con el factor de potencia del proyecto, lo que resulta algo más conservador que tratarlo como VA.</li></ul>
<p><b>Escuelas (Regla 050-204), hospitales (050-206) y hoteles, moteles y dormitorios (050-208)</b> tienen reglas propias y se eligen en el mismo selector. En escuelas se indica además el <b>área de aulas</b> y en hospitales el <b>área de alta intensidad</b> (salas de operación), en el 1er piso y en cada piso de la lista. La diferencia principal con la Tabla 14 es que en estas reglas el <b>factor de demanda se aplica a toda la carga</b>, incluidas las cargas especiales (aire acondicionado, equipos, alumbrado especial como salones de baile); solo la calefacción se rige por la Sección 270. Hasta 900 m² se aplica un único factor; en edificaciones mayores la carga se divide entre el área y se aplica un factor a los primeros 900 m² y otro al exceso.</p>`;
